# ─────────────────────────────────────────────────────────────
# ATLAS Retrieval Training Configuration
# ─────────────────────────────────────────────────────────────

model:
  base: "Qwen/Qwen3-Embedding-0.6B"
  method: "lora"                  # lora | full | projection_head
  lora_r: 16                      # LoRA rank (higher = more capacity, more VRAM)
  lora_alpha: 32                  # LoRA scaling factor
  lora_target_modules:            # Which transformer layers to adapt
    - "q_proj"
    - "v_proj"
  lora_dropout: 0.05

training:
  loss: "mnrl"                    # Multiple Negatives Ranking Loss
  epochs: 3
  batch_size: 16                  # per-device batch size
  learning_rate: 2.0e-5
  warmup_ratio: 0.1
  weight_decay: 0.01
  hard_negatives_per_query: 5     # total negatives sampled per query
  temperature: 0.05               # InfoNCE temperature
  fp16: true                      # Use mixed precision for training
  gradient_accumulation_steps: 2
  seed: 42

data:
  dataset_path: "training/retrieval_dataset.json"
  eval_split: 0.15                # hold out ~15% of queries for evaluation
  enrichment_mode: "transcript+caption+ocr"  # transcript_only | transcript+ocr | transcript+caption+ocr

  # Negative sampling tier distribution
  negatives:
    easy_count: 2                 # random segments from other videos
    medium_count: 2               # same video, different scene (scene_id gap > 2)
    hard_temporal_count: 1        # adjacent segment (index ± 1)
    hard_keyword_count: 1         # same video, shared keywords, different scene
    hard_visual_count: 0          # visually similar scene, wrong text (optional)

output:
  model_dir: "training/checkpoints"
  eval_results: "training/eval_results.json"
  logs_dir: "training/logs"
