reranker_stage2:
  model_name: "BAAI/bge-reranker-base"
  method: "full"

  data:
    train_pairs: "training/reranker/train_pairs.jsonl"
    dev_pairs: "training/reranker/dev_pairs.jsonl"
    max_query_chars: 256
    max_doc_chars: 1024
    negatives_per_query: 12

  optimization:
    lr: 1.0e-5
    batch_size: 8
    grad_accum: 4
    epochs: 2
    weight_decay: 0.01
    warmup_ratio: 0.1
